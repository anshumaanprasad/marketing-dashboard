<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Analytics Dashboard</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Work+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B35;
            --secondary: #004E89;
            --accent: #F7B801;
            --dark: #1A1A2E;
            --light: #F8F9FA;
        }
        
        body {
            font-family: 'Work Sans', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
        }
        
        .mono {
            font-family: 'Space Mono', monospace;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .metric-card {
            background: linear-gradient(135deg, var(--secondary) 0%, #003d6b 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }
        
        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: translate(30%, -30%);
        }
        
        .chart-container {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
        }
        
        .filter-tag {
            background: var(--accent);
            color: var(--dark);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 107, 53, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: var(--secondary);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: 2px solid var(--secondary);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-secondary:hover {
            background: var(--secondary);
            color: white;
        }
        
        .creative-suggestion {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            border-left: 4px solid var(--accent);
            padding: 1.5rem;
            border-radius: 8px;
            margin: 1rem 0;
        }
        
        .insight-badge {
            background: var(--primary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        
        .trend-up { color: #00b894; font-weight: 700; }
        .trend-down { color: #d63031; font-weight: 700; }
        
        select, input[type="text"] {
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border 0.3s;
        }
        
        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .campaign-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .campaign-card:hover {
            border-color: var(--primary);
            transform: translateX(4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }
        
        .campaign-card.selected {
            border-color: var(--secondary);
            background: linear-gradient(135deg, rgba(0, 78, 137, 0.05) 0%, rgba(102, 126, 234, 0.05) 100%);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function MarketingDashboard() {
            const [campaigns, setCampaigns] = useState([]);
            const [decisions, setDecisions] = useState([]);
            const [timeRange, setTimeRange] = useState('all');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [aiInsights, setAiInsights] = useState(null);
            const [selectedCampaign, setSelectedCampaign] = useState(null);
            const [selectedPlatform, setSelectedPlatform] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');
            const [chartType, setChartType] = useState('spend');
            const [creativeSuggestions, setCreativeSuggestions] = useState(null);

            useEffect(() => {
                loadData();
            }, []);

            const loadData = async () => {
                try {
                    const storedCampaigns = await window.storage?.get('campaigns');
                    const storedDecisions = await window.storage?.get('decisions');
                    
                    if (storedCampaigns?.value) {
                        setCampaigns(JSON.parse(storedCampaigns.value));
                    }
                    if (storedDecisions?.value) {
                        setDecisions(JSON.parse(storedDecisions.value));
                    }
                } catch (error) {
                    console.log('Storage not available, using session state');
                }
            };

            const saveData = async (newCampaigns, newDecisions) => {
                try {
                    if (newCampaigns) {
                        await window.storage?.set('campaigns', JSON.stringify(newCampaigns));
                    }
                    if (newDecisions !== undefined) {
                        await window.storage?.set('decisions', JSON.stringify(newDecisions));
                    }
                } catch (error) {
                    console.log('Storage not available');
                }
            };

            const handleFileUpload = (event, platform) => {
                const file = event.target.files[0];
                if (!file) return;

                Papa.parse(file, {
                    header: true,
                    complete: (results) => {
                        const processedData = processCampaignData(results.data, platform);
                        
                        if (processedData.length === 0) {
                            alert('No valid campaign data found in the CSV. Please check the file format.');
                            return;
                        }
                        
                        const aggregated = aggregateCampaigns(processedData);
                        const updatedCampaigns = [...campaigns, ...aggregated];
                        setCampaigns(updatedCampaigns);
                        saveData(updatedCampaigns, decisions);
                        
                        alert(`Successfully loaded ${aggregated.length} campaigns from ${platform.toUpperCase()}`);
                    },
                    error: (error) => {
                        alert('Error parsing CSV: ' + error.message);
                    }
                });
            };

            const processCampaignData = (data, platform) => {
                const cleanData = data.filter(row => {
                    if (platform === 'google') {
                        return row.Campaign && 
                               row.Campaign !== 'Campaign' && 
                               row.Campaign !== 'Campaign performance' &&
                               row['Campaign status'] !== 'Paused' &&
                               (row.Clicks || row.Impr || row.Cost);
                    } else {
                        return row['Campaign name'] && 
                               row['Campaign name'] !== '' &&
                               (row.Impressions > 0 || row['Amount spent (INR)'] > 0);
                    }
                });

                return cleanData.map(row => {
                    if (platform === 'google') {
                        const clicks = parseInt(String(row.Clicks || 0).replace(/,/g, '')) || 0;
                        const impressions = parseInt(String(row['Impr.'] || row.Impr || 0).replace(/,/g, '')) || 0;
                        const cost = parseFloat(String(row.Cost || 0).replace(/,/g, '')) || 0;
                        const conversions = parseFloat(String(row.Conversions || 0).replace(/,/g, '')) || 0;
                        const ctr = parseFloat(String(row.CTR || row['CTR'] || 0).replace(/%/g, '')) || 0;
                        const cpc = parseFloat(String(row['Avg. CPC'] || 0).replace(/,/g, '')) || 0;
                        
                        return {
                            id: `google-${Date.now()}-${Math.random()}`,
                            platform: 'google',
                            name: row.Campaign || 'Unnamed Campaign',
                            impressions: impressions,
                            clicks: clicks,
                            spend: cost,
                            conversions: conversions,
                            date: row.Month || new Date().toISOString().split('T')[0],
                            creative: row['Campaign type'] || '',
                            ctr: ctr,
                            cpc: cpc,
                            cpa: conversions > 0 ? cost / conversions : 0,
                        };
                    } else {
                        const impressions = parseInt(String(row.Impressions || 0).replace(/,/g, '')) || 0;
                        const clicks = parseInt(String(row['Clicks (all)'] || 0).replace(/,/g, '')) || 0;
                        const spend = parseFloat(String(row['Amount spent (INR)'] || 0).replace(/,/g, '')) || 0;
                        const purchases = parseInt(String(row.Purchases || 0).replace(/,/g, '')) || 0;
                        const leads = parseInt(String(row.Leads || 0).replace(/,/g, '')) || 0;
                        const conversions = purchases + leads;
                        const ctr = parseFloat(String(row['CTR (all)'] || 0).replace(/%/g, '')) || 0;
                        const cpc = parseFloat(String(row['CPC (all)'] || 0).replace(/,/g, '')) || 0;
                        
                        return {
                            id: `meta-${Date.now()}-${Math.random()}`,
                            platform: 'meta',
                            name: row['Campaign name'] || 'Unnamed Campaign',
                            impressions: impressions,
                            clicks: clicks,
                            spend: spend,
                            conversions: conversions,
                            date: row.Month || row['Reporting starts'] || new Date().toISOString().split('T')[0],
                            creative: row['Ad name'] || row['Ad set name'] || '',
                            ctr: ctr,
                            cpc: cpc,
                            cpa: conversions > 0 ? spend / conversions : 0,
                        };
                    }
                }).filter(campaign => campaign.impressions > 0 || campaign.spend > 0);
            };

            const aggregateCampaigns = (campaigns) => {
                const grouped = campaigns.reduce((acc, camp) => {
                    const key = `${camp.platform}-${camp.name}`;
                    if (!acc[key]) {
                        acc[key] = [];
                    }
                    acc[key].push(camp);
                    return acc;
                }, {});

                return Object.entries(grouped).map(([key, camps]) => {
                    const totalSpend = camps.reduce((sum, c) => sum + c.spend, 0);
                    const totalConversions = camps.reduce((sum, c) => sum + c.conversions, 0);
                    const totalClicks = camps.reduce((sum, c) => sum + c.clicks, 0);
                    const totalImpressions = camps.reduce((sum, c) => sum + c.impressions, 0);
                    
                    return {
                        id: camps[0].id,
                        platform: camps[0].platform,
                        name: camps[0].name,
                        impressions: totalImpressions,
                        clicks: totalClicks,
                        spend: totalSpend,
                        conversions: totalConversions,
                        date: camps[0].date,
                        creative: camps[0].creative,
                        ctr: totalImpressions > 0 ? (totalClicks / totalImpressions) * 100 : 0,
                        cpc: totalClicks > 0 ? totalSpend / totalClicks : 0,
                        cpa: totalConversions > 0 ? totalSpend / totalConversions : 0,
                        monthlyData: camps
                    };
                });
            };

            const analyzeWithAI = async () => {
                if (campaigns.length === 0) {
                    alert('Please upload campaign data first');
                    return;
                }

                setIsAnalyzing(true);
                const basicInsights = generateBasicInsights(getFilteredCampaigns());
                setAiInsights(basicInsights);
                setIsAnalyzing(false);
            };

            const generateCreativeSuggestions = (campaign) => {
                if (!campaign) return;

                setIsAnalyzing(true);
                
                const suggestions = {
                    headlines: [],
                    adCopy: [],
                    visualConcepts: [],
                    targetingIdeas: []
                };

                const avgCTR = campaigns.reduce((sum, c) => sum + c.ctr, 0) / campaigns.length;
                const needsRefresh = campaign.ctr < avgCTR * 0.7;

                if (needsRefresh) {
                    suggestions.headlines = [
                        `"Transform Your Career in ${new Date().getFullYear()}" - Urgency-driven`,
                        `"Join 50,000+ Professionals Who Chose Us" - Social proof`,
                        `"Limited Seats: Master ${campaign.name.includes('Data') ? 'Data Science' : 'Tech Skills'} in 6 Months" - Scarcity + Specificity`
                    ];

                    suggestions.adCopy = [
                        "Problem-Solution Format: Start with pain point (e.g., 'Stuck in dead-end job?'), then offer solution",
                        "Benefit-driven: Focus on outcomes ('Land ₹15L+ salary') rather than features",
                        "Question-based: 'Ready to 10x your earning potential?' engages curiosity"
                    ];

                    suggestions.visualConcepts = [
                        "Before/After visual: Show career transformation journey",
                        "Data visualization: Graph showing salary growth after course completion",
                        "Student testimonials: Real faces with specific salary numbers and company logos"
                    ];
                } else {
                    suggestions.headlines = [
                        `Current creative performing well! Consider A/B testing: "${campaign.name} - New Variant A"`,
                        `Scale winner: Duplicate current ad with 20% budget increase`,
                        `Test premium positioning: "India's #1 ${campaign.name.split(' ')[0]} Program"`
                    ];

                    suggestions.adCopy = [
                        "Your current messaging resonates. Test slight variations in CTA urgency",
                        "Experiment with longer-form storytelling in description",
                        "Add trust signals: 'Trusted by Fortune 500 companies'"
                    ];

                    suggestions.visualConcepts = [
                        "Keep current visual style but test seasonal variations",
                        "Create video version of top-performing static ad",
                        "Test carousel format showcasing multiple success stories"
                    ];
                }

                suggestions.targetingIdeas = [
                    `Lookalike audiences based on ${campaign.conversions > 50 ? 'converters' : 'engaged users'}`,
                    `Exclude existing students to reduce wasted spend`,
                    `Layer interest targeting: 'Career Development' + 'Online Learning'`,
                    `Test age segments: 22-27 vs 28-35 for different messaging`
                ];

                setCreativeSuggestions(suggestions);
                setIsAnalyzing(false);
            };

            const generateBasicInsights = (filteredCampaigns) => {
                const totalSpend = filteredCampaigns.reduce((sum, c) => sum + c.spend, 0);
                const totalConversions = filteredCampaigns.reduce((sum, c) => sum + c.conversions, 0);
                const totalClicks = filteredCampaigns.reduce((sum, c) => sum + c.clicks, 0);
                const totalImpressions = filteredCampaigns.reduce((sum, c) => sum + c.impressions, 0);
                
                const avgCPA = totalConversions > 0 ? totalSpend / totalConversions : 0;
                const avgCTR = totalImpressions > 0 ? (totalClicks / totalImpressions) * 100 : 0;

                const campaignsWithMetrics = filteredCampaigns.filter(c => c.conversions > 0).map(c => ({
                    ...c,
                    cpa: c.spend / c.conversions,
                    roi: c.conversions > 0 ? (c.conversions * 100 - c.spend) / c.spend : 0
                }));

                const campaignsByCPA = [...campaignsWithMetrics].sort((a, b) => a.cpa - b.cpa);
                const bestCampaign = campaignsByCPA[0];
                const worstCampaign = campaignsByCPA[campaignsByCPA.length - 1];

                let trends = `📊 Analyzing ${filteredCampaigns.length} campaigns with total spend of ₹${totalSpend.toLocaleString('en-IN', {maximumFractionDigits: 0})} generating ${totalConversions} conversions. Average CPA: ₹${avgCPA.toFixed(2)}, Average CTR: ${avgCTR.toFixed(2)}%.`;

                let working = bestCampaign ? `🎯 "${bestCampaign.name}" leads with CPA of ₹${bestCampaign.cpa.toFixed(2)} - ${((avgCPA / bestCampaign.cpa - 1) * 100).toFixed(0)}% better than average.` : '';

                let notWorking = worstCampaign && campaignsByCPA.length > 1 ? `⚠️ "${worstCampaign.name}" has CPA of ₹${worstCampaign.cpa.toFixed(2)}, ${((worstCampaign.cpa / avgCPA - 1) * 100).toFixed(0)}% above average.` : '';

                let recommendations = [];
                
                if (bestCampaign) {
                    recommendations.push({
                        action: `Scale "${bestCampaign.name}" by 25%`,
                        reason: `Lowest CPA with proven conversion efficiency`
                    });
                }

                if (worstCampaign && worstCampaign.cpa > avgCPA * 1.5) {
                    recommendations.push({
                        action: `Pause or revise "${worstCampaign.name}"`,
                        reason: `CPA critically high - reallocate budget to better performers`
                    });
                }

                const lowCTR = filteredCampaigns.filter(c => c.ctr > 0 && c.ctr < avgCTR * 0.7);
                if (lowCTR.length > 0) {
                    recommendations.push({
                        action: `Refresh creatives for ${lowCTR.length} campaigns`,
                        reason: `CTR significantly below average indicates ad fatigue`
                    });
                }

                return { trends, working, notWorking, recommendations };
            };

            const getFilteredCampaigns = () => {
                let filtered = campaigns;

                if (selectedPlatform !== 'all') {
                    filtered = filtered.filter(c => c.platform === selectedPlatform);
                }

                if (searchTerm) {
                    filtered = filtered.filter(c => 
                        c.name.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }

                return filtered;
            };

            const clearAllData = () => {
                if (confirm('Clear all data? This cannot be undone.')) {
                    setCampaigns([]);
                    setDecisions([]);
                    setAiInsights(null);
                    setSelectedCampaign(null);
                    setCreativeSuggestions(null);
                    saveData([], []);
                }
            };

            const addDecision = (recommendation) => {
                const newDecision = {
                    id: Date.now(),
                    action: recommendation.action,
                    reason: recommendation.reason,
                    status: 'pending',
                    createdAt: new Date().toISOString(),
                };
                const updatedDecisions = [...decisions, newDecision];
                setDecisions(updatedDecisions);
                saveData(campaigns, updatedDecisions);
            };

            const updateDecisionStatus = (id, status) => {
                const updatedDecisions = decisions.map(d => 
                    d.id === id ? { ...d, status, completedAt: status === 'completed' ? new Date().toISOString() : null } : d
                );
                setDecisions(updatedDecisions);
                saveData(campaigns, updatedDecisions);
            };

            const filteredCampaigns = getFilteredCampaigns();

            return (
                <div className="min-h-screen p-4">
                    {/* Header */}
                    <header className="glass rounded-2xl p-6 mb-6 fade-in">
                        <div className="flex justify-between items-center">
                            <div>
                                <h1 className="text-4xl font-bold text-gray-900 mono">Marketing Analytics</h1>
                                <p className="text-gray-600 mt-2">Performance Intelligence Dashboard</p>
                            </div>
                            {campaigns.length > 0 && (
                                <button onClick={clearAllData} className="text-sm text-red-600 hover:text-red-800 font-semibold">
                                    🗑️ Clear Data
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Upload Section */}
                    <div className="glass rounded-2xl p-6 mb-6 fade-in">
                        <h2 className="text-xl font-bold mb-4">Upload Campaign Data</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block mb-2 font-semibold">Google Ads CSV</label>
                                <input 
                                    type="file" 
                                    accept=".csv"
                                    onChange={(e) => handleFileUpload(e, 'google')}
                                    className="w-full p-2 border rounded"
                                />
                            </div>
                            <div>
                                <label className="block mb-2 font-semibold">Meta Ads CSV</label>
                                <input 
                                    type="file" 
                                    accept=".csv"
                                    onChange={(e) => handleFileUpload(e, 'meta')}
                                    className="w-full p-2 border rounded"
                                />
                            </div>
                        </div>
                        {campaigns.length > 0 && (
                            <div className="mt-4">
                                <button onClick={analyzeWithAI} disabled={isAnalyzing} className="btn-primary">
                                    {isAnalyzing ? '⚙️ Analyzing...' : '🎯 Analyze Campaigns'}
                                </button>
                                <span className="ml-4 text-sm text-gray-600 mono">{campaigns.length} campaigns loaded</span>
                            </div>
                        )}
                    </div>

                    {campaigns.length > 0 && (
                        <>
                            {/* Filters & Controls */}
                            <div className="glass rounded-2xl p-6 mb-6 fade-in">
                                <h3 className="text-lg font-bold mb-4">Filters & Views</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <label className="block mb-2 font-semibold text-sm">Platform</label>
                                        <select 
                                            value={selectedPlatform}
                                            onChange={(e) => setSelectedPlatform(e.target.value)}
                                            className="w-full"
                                        >
                                            <option value="all">All Platforms</option>
                                            <option value="google">Google Ads</option>
                                            <option value="meta">Meta Ads</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block mb-2 font-semibold text-sm">Search Campaign</label>
                                        <input 
                                            type="text"
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                            placeholder="Type to search..."
                                            className="w-full"
                                        />
                                    </div>
                                    <div>
                                        <label className="block mb-2 font-semibold text-sm">Chart Metric</label>
                                        <select 
                                            value={chartType}
                                            onChange={(e) => setChartType(e.target.value)}
                                            className="w-full"
                                        >
                                            <option value="spend">Spend (₹)</option>
                                            <option value="conversions">Conversions</option>
                                            <option value="ctr">CTR (%)</option>
                                            <option value="cpa">CPA (₹)</option>
                                        </select>
                                    </div>
                                </div>
                                {(selectedPlatform !== 'all' || searchTerm) && (
                                    <div className="mt-4 flex gap-2">
                                        {selectedPlatform !== 'all' && (
                                            <span className="filter-tag">
                                                {selectedPlatform.toUpperCase()}
                                                <button onClick={() => setSelectedPlatform('all')}>✕</button>
                                            </span>
                                        )}
                                        {searchTerm && (
                                            <span className="filter-tag">
                                                "{searchTerm}"
                                                <button onClick={() => setSearchTerm('')}>✕</button>
                                            </span>
                                        )}
                                    </div>
                                )}
                            </div>

                            {/* Performance Overview */}
                            <PerformanceOverview campaigns={filteredCampaigns} chartType={chartType} />

                            {/* Campaign List */}
                            <CampaignList 
                                campaigns={filteredCampaigns} 
                                selectedCampaign={selectedCampaign}
                                onSelectCampaign={(c) => {
                                    setSelectedCampaign(c);
                                    generateCreativeSuggestions(c);
                                }}
                            />

                            {/* Campaign Deep Dive */}
                            {selectedCampaign && (
                                <CampaignDeepDive 
                                    campaign={selectedCampaign}
                                    creativeSuggestions={creativeSuggestions}
                                    onClose={() => {
                                        setSelectedCampaign(null);
                                        setCreativeSuggestions(null);
                                    }}
                                />
                            )}

                            {/* Insights */}
                            {aiInsights && (
                                <InsightsPanel 
                                    insights={aiInsights}
                                    onTrackDecision={addDecision}
                                />
                            )}

                            {/* Decision Tracker */}
                            {decisions.length > 0 && (
                                <DecisionTracker 
                                    decisions={decisions}
                                    onUpdateStatus={updateDecisionStatus}
                                />
                            )}
                        </>
                    )}
                </div>
            );
        }

        // Performance Overview Component with Charts
        function PerformanceOverview({ campaigns, chartType }) {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartRef.current && campaigns.length > 0) {
                    const ctx = chartRef.current.getContext('2d');
                    
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }

                    const topCampaigns = [...campaigns]
                        .sort((a, b) => b.spend - a.spend)
                        .slice(0, 10);

                    const labels = topCampaigns.map(c => c.name.substring(0, 25) + (c.name.length > 25 ? '...' : ''));
                    
                    let data, label, backgroundColor;
                    
                    switch(chartType) {
                        case 'spend':
                            data = topCampaigns.map(c => c.spend);
                            label = 'Spend (₹)';
                            backgroundColor = '#FF6B35';
                            break;
                        case 'conversions':
                            data = topCampaigns.map(c => c.conversions);
                            label = 'Conversions';
                            backgroundColor = '#00b894';
                            break;
                        case 'ctr':
                            data = topCampaigns.map(c => c.ctr);
                            label = 'CTR (%)';
                            backgroundColor = '#F7B801';
                            break;
                        case 'cpa':
                            data = topCampaigns.map(c => c.cpa);
                            label = 'CPA (₹)';
                            backgroundColor = '#6c5ce7';
                            break;
                    }

                    chartInstance.current = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: label,
                                data: data,
                                backgroundColor: backgroundColor,
                                borderRadius: 8,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    display: false
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    grid: {
                                        color: 'rgba(0,0,0,0.05)'
                                    }
                                },
                                x: {
                                    grid: {
                                        display: false
                                    }
                                }
                            }
                        }
                    });
                }
            }, [campaigns, chartType]);

            const totalSpend = campaigns.reduce((sum, c) => sum + c.spend, 0);
            const totalConversions = campaigns.reduce((sum, c) => sum + c.conversions, 0);
            const avgCPA = totalConversions > 0 ? totalSpend / totalConversions : 0;
            const totalClicks = campaigns.reduce((sum, c) => sum + c.clicks, 0);
            const totalImpressions = campaigns.reduce((sum, c) => sum + c.impressions, 0);
            const avgCTR = totalImpressions > 0 ? (totalClicks / totalImpressions) * 100 : 0;

            return (
                <div className="glass rounded-2xl p-6 mb-6 fade-in">
                    <h2 className="text-2xl font-bold mb-6">Performance Overview</h2>
                    
                    {/* Metrics Grid */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div className="metric-card">
                            <div className="text-sm opacity-90 mb-1">Total Spend</div>
                            <div className="text-2xl font-bold mono">₹{totalSpend.toLocaleString('en-IN', {maximumFractionDigits: 0})}</div>
                        </div>
                        <div className="metric-card">
                            <div className="text-sm opacity-90 mb-1">Conversions</div>
                            <div className="text-2xl font-bold mono">{totalConversions.toLocaleString()}</div>
                        </div>
                        <div className="metric-card">
                            <div className="text-sm opacity-90 mb-1">Avg CPA</div>
                            <div className="text-2xl font-bold mono">₹{avgCPA.toFixed(0)}</div>
                        </div>
                        <div className="metric-card">
                            <div className="text-sm opacity-90 mb-1">Avg CTR</div>
                            <div className="text-2xl font-bold mono">{avgCTR.toFixed(2)}%</div>
                        </div>
                    </div>

                    {/* Chart */}
                    <div className="chart-container">
                        <h3 className="font-bold mb-4">Top 10 Campaigns by {chartType.toUpperCase()}</h3>
                        <div style={{height: '300px'}}>
                            <canvas ref={chartRef}></canvas>
                        </div>
                    </div>
                </div>
            );
        }

        // Campaign List Component
        function CampaignList({ campaigns, selectedCampaign, onSelectCampaign }) {
            return (
                <div className="glass rounded-2xl p-6 mb-6 fade-in">
                    <h2 className="text-2xl font-bold mb-4">Campaigns ({campaigns.length})</h2>
                    <div className="max-h-96 overflow-y-auto">
                        {campaigns.map(campaign => (
                            <div 
                                key={campaign.id}
                                className={`campaign-card ${selectedCampaign?.id === campaign.id ? 'selected' : ''}`}
                                onClick={() => onSelectCampaign(campaign)}
                            >
                                <div className="flex justify-between items-start">
                                    <div className="flex-1">
                                        <div className="flex items-center gap-2 mb-2">
                                            <h3 className="font-bold text-lg">{campaign.name}</h3>
                                            <span className="insight-badge">{campaign.platform}</span>
                                        </div>
                                        <div className="grid grid-cols-4 gap-4 text-sm">
                                            <div>
                                                <span className="text-gray-500">Spend:</span>
                                                <span className="ml-1 font-semibold">₹{campaign.spend.toLocaleString('en-IN', {maximumFractionDigits: 0})}</span>
                                            </div>
                                            <div>
                                                <span className="text-gray-500">Conv:</span>
                                                <span className="ml-1 font-semibold">{campaign.conversions}</span>
                                            </div>
                                            <div>
                                                <span className="text-gray-500">CPA:</span>
                                                <span className="ml-1 font-semibold">₹{campaign.cpa.toFixed(0)}</span>
                                            </div>
                                            <div>
                                                <span className="text-gray-500">CTR:</span>
                                                <span className="ml-1 font-semibold">{campaign.ctr.toFixed(2)}%</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        {selectedCampaign?.id === campaign.id ? (
                                            <span className="text-sm text-blue-600 font-semibold">Selected →</span>
                                        ) : (
                                            <span className="text-sm text-gray-400">Click for details</span>
                                        )}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // Campaign Deep Dive Component
        function CampaignDeepDive({ campaign, creativeSuggestions, onClose }) {
            const trendChartRef = useRef(null);
            const trendChartInstance = useRef(null);

            useEffect(() => {
                if (trendChartRef.current && campaign.monthlyData && campaign.monthlyData.length > 1) {
                    const ctx = trendChartRef.current.getContext('2d');
                    
                    if (trendChartInstance.current) {
                        trendChartInstance.current.destroy();
                    }

                    const sortedData = [...campaign.monthlyData].sort((a, b) => 
                        new Date(a.date) - new Date(b.date)
                    );

                    trendChartInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: sortedData.map(d => d.date),
                            datasets: [
                                {
                                    label: 'Spend (₹)',
                                    data: sortedData.map(d => d.spend),
                                    borderColor: '#FF6B35',
                                    backgroundColor: 'rgba(255, 107, 53, 0.1)',
                                    yAxisID: 'y',
                                },
                                {
                                    label: 'Conversions',
                                    data: sortedData.map(d => d.conversions),
                                    borderColor: '#00b894',
                                    backgroundColor: 'rgba(0, 184, 148, 0.1)',
                                    yAxisID: 'y1',
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    type: 'linear',
                                    position: 'left',
                                    title: {
                                        display: true,
                                        text: 'Spend (₹)'
                                    }
                                },
                                y1: {
                                    type: 'linear',
                                    position: 'right',
                                    title: {
                                        display: true,
                                        text: 'Conversions'
                                    },
                                    grid: {
                                        drawOnChartArea: false,
                                    },
                                }
                            }
                        }
                    });
                }
            }, [campaign]);

            return (
                <div className="glass rounded-2xl p-6 mb-6 fade-in">
                    <div className="flex justify-between items-center mb-6">
                        <div>
                            <h2 className="text-2xl font-bold">{campaign.name}</h2>
                            <span className="insight-badge mt-2 inline-block">{campaign.platform.toUpperCase()}</span>
                        </div>
                        <button onClick={onClose} className="text-2xl text-gray-500 hover:text-gray-700">✕</button>
                    </div>

                    {/* Performance Trend */}
                    {campaign.monthlyData && campaign.monthlyData.length > 1 && (
                        <div className="chart-container mb-6">
                            <h3 className="font-bold mb-4">Performance Trend</h3>
                            <div style={{height: '250px'}}>
                                <canvas ref={trendChartRef}></canvas>
                            </div>
                        </div>
                    )}

                    {/* Creative Suggestions */}
                    {creativeSuggestions && (
                        <div className="mt-6">
                            <h3 className="text-xl font-bold mb-4">🎨 AI Creative Suggestions</h3>
                            
                            <div className="creative-suggestion mb-4">
                                <h4 className="font-bold mb-2">Headlines</h4>
                                <ul className="list-disc list-inside space-y-1">
                                    {creativeSuggestions.headlines.map((h, i) => (
                                        <li key={i} className="text-sm">{h}</li>
                                    ))}
                                </ul>
                            </div>

                            <div className="creative-suggestion mb-4">
                                <h4 className="font-bold mb-2">Ad Copy Approaches</h4>
                                <ul className="list-disc list-inside space-y-1">
                                    {creativeSuggestions.adCopy.map((a, i) => (
                                        <li key={i} className="text-sm">{a}</li>
                                    ))}
                                </ul>
                            </div>

                            <div className="creative-suggestion mb-4">
                                <h4 className="font-bold mb-2">Visual Concepts</h4>
                                <ul className="list-disc list-inside space-y-1">
                                    {creativeSuggestions.visualConcepts.map((v, i) => (
                                        <li key={i} className="text-sm">{v}</li>
                                    ))}
                                </ul>
                            </div>

                            <div className="creative-suggestion">
                                <h4 className="font-bold mb-2">Targeting Ideas</h4>
                                <ul className="list-disc list-inside space-y-1">
                                    {creativeSuggestions.targetingIdeas.map((t, i) => (
                                        <li key={i} className="text-sm">{t}</li>
                                    ))}
                                </ul>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Insights Panel Component
        function InsightsPanel({ insights, onTrackDecision }) {
            return (
                <div className="glass rounded-2xl p-6 mb-6 fade-in">
                    <h2 className="text-2xl font-bold mb-4">🎯 Campaign Insights</h2>
                    
                    <div className="bg-blue-50 border-l-4 border-blue-500 p-4 mb-4 rounded">
                        <h3 className="font-bold mb-2">📊 Overview</h3>
                        <p>{insights.trends}</p>
                    </div>

                    {insights.working && (
                        <div className="bg-green-50 border-l-4 border-green-500 p-4 mb-4 rounded">
                            <h3 className="font-bold mb-2">✅ What's Working</h3>
                            <p>{insights.working}</p>
                        </div>
                    )}

                    {insights.notWorking && (
                        <div className="bg-red-50 border-l-4 border-red-500 p-4 mb-4 rounded">
                            <h3 className="font-bold mb-2">⚠️ Needs Attention</h3>
                            <p>{insights.notWorking}</p>
                        </div>
                    )}

                    {insights.recommendations && insights.recommendations.length > 0 && (
                        <div className="mt-4">
                            <h3 className="font-bold mb-3">💡 Recommendations</h3>
                            {insights.recommendations.map((rec, idx) => (
                                <div key={idx} className="bg-white p-4 mb-2 rounded border-l-4 border-yellow-500">
                                    <div className="flex justify-between items-start">
                                        <div className="flex-1">
                                            <p className="font-semibold">{rec.action}</p>
                                            <p className="text-sm text-gray-600 mt-1">{rec.reason}</p>
                                        </div>
                                        <button onClick={() => onTrackDecision(rec)} className="btn-secondary ml-4 text-sm py-2 px-3">
                                            Track
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // Decision Tracker Component
        function DecisionTracker({ decisions, onUpdateStatus }) {
            const pending = decisions.filter(d => d.status === 'pending');
            const completed = decisions.filter(d => d.status === 'completed');

            return (
                <div className="glass rounded-2xl p-6 mb-6 fade-in">
                    <h2 className="text-2xl font-bold mb-4">📋 Decision Tracker</h2>
                    
                    {pending.length > 0 && (
                        <div className="mb-6">
                            <h3 className="font-bold mb-3">Pending ({pending.length})</h3>
                            {pending.map(d => (
                                <div key={d.id} className="bg-yellow-50 p-4 mb-2 rounded border-l-4 border-yellow-500">
                                    <div className="flex justify-between items-start">
                                        <div className="flex-1">
                                            <p className="font-semibold">{d.action}</p>
                                            <p className="text-sm text-gray-600 mt-1">{d.reason}</p>
                                        </div>
                                        <button onClick={() => onUpdateStatus(d.id, 'completed')} className="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                                            ✓ Done
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {completed.length > 0 && (
                        <div>
                            <h3 className="font-bold mb-3">Completed ({completed.length})</h3>
                            {completed.map(d => (
                                <div key={d.id} className="bg-green-50 p-4 mb-2 rounded border-l-4 border-green-500">
                                    <p className="font-semibold text-gray-700">{d.action}</p>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<MarketingDashboard />, document.getElementById('root'));
    </script>
</body>
</html>
