<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Marketing Command Center</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0e27;
            color: #e4e4e7;
        }
        
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .glass-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        
        .metric-card {
            background: linear-gradient(135deg, rgba(102,126,234,0.2) 0%, rgba(118,75,162,0.2) 100%);
            border: 1px solid rgba(102,126,234,0.3);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .metric-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(102,126,234,0.3);
        }
        
        .comparison-card {
            background: rgba(255,255,255,0.03);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1.5rem;
            position: relative;
        }
        
        .comparison-card.winner {
            border-color: #22c55e;
            background: linear-gradient(135deg, rgba(34,197,94,0.1) 0%, rgba(22,163,74,0.05) 100%);
        }
        
        .tab-button {
            background: transparent;
            border: none;
            color: #a1a1aa;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        
        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102,126,234,0.6);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #e4e4e7;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        input, select {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #e4e4e7;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.875rem;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255,255,255,0.08);
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }
        
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }
        
        .campaign-row {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.5rem;
            transition: all 0.3s;
        }
        
        .campaign-row:hover {
            background: rgba(255,255,255,0.08);
            border-color: #667eea;
        }
        
        .campaign-row.selected {
            background: linear-gradient(135deg, rgba(102,126,234,0.15) 0%, rgba(118,75,162,0.15) 100%);
            border-color: #667eea;
        }
        
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .badge-google {
            background: rgba(66,133,244,0.2);
            color: #4285f4;
            border: 1px solid rgba(66,133,244,0.3);
        }
        
        .badge-meta {
            background: rgba(24,119,242,0.2);
            color: #1877f2;
            border: 1px solid rgba(24,119,242,0.3);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .chart-container {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 1rem;
        }
        
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
        
        @media (max-width: 1024px) {
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
            .grid-3 { grid-template-columns: repeat(2, 1fr); }
        }
        
        @media (max-width: 640px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
        }
        
        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .winner-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #22c55e;
            color: white;
            padding: 0.5rem;
            border-radius: 50%;
            font-size: 1.2rem;
        }
        
        .vs-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function EnterpriseDashboard() {
            const [campaigns, setCampaigns] = useState([]);
            const [selectedCampaigns, setSelectedCampaigns] = useState([]);
            const [activeTab, setActiveTab] = useState('overview');
            const [dateRange, setDateRange] = useState({ start: null, end: null });
            const [platformFilter, setPlatformFilter] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');
            const [comparisonMode, setComparisonMode] = useState(false);
            const [selectedMetrics, setSelectedMetrics] = useState(['spend', 'conversions', 'cpa', 'ctr']);
            const [benchmarkMode, setBenchmarkMode] = useState('average'); // 'average' or 'top'
            const [cohortBy, setCohortBy] = useState('platform'); // 'platform', 'performance', 'date'

            useEffect(() => {
                loadData();
            }, []);

            const loadData = async () => {
                try {
                    const stored = await window.storage?.get('campaigns');
                    if (stored?.value) {
                        setCampaigns(JSON.parse(stored.value));
                    }
                } catch (error) {
                    console.log('Storage not available');
                }
            };

            const saveData = async (data) => {
                try {
                    await window.storage?.set('campaigns', JSON.stringify(data));
                } catch (error) {
                    console.log('Storage not available');
                }
            };

            const handleFileUpload = (event, platform) => {
                const file = event.target.files[0];
                if (!file) return;

                Papa.parse(file, {
                    header: true,
                    complete: (results) => {
                        const processed = processCampaignData(results.data, platform);
                        if (processed.length === 0) {
                            alert('No valid data found');
                            return;
                        }
                        const aggregated = aggregateCampaigns(processed);
                        const updated = [...campaigns, ...aggregated];
                        setCampaigns(updated);
                        saveData(updated);
                        alert(`Loaded ${aggregated.length} campaigns from ${platform.toUpperCase()}`);
                    }
                });
            };

            const processCampaignData = (data, platform) => {
                const cleanData = data.filter(row => {
                    if (platform === 'google') {
                        return row.Campaign && 
                               row.Campaign !== 'Campaign' && 
                               row.Campaign !== 'Campaign performance' &&
                               row['Campaign status'] !== 'Paused' &&
                               (row.Clicks || row.Impr || row.Cost);
                    } else {
                        return row['Campaign name'] && 
                               row['Campaign name'] !== '' &&
                               (row.Impressions > 0 || row['Amount spent (INR)'] > 0);
                    }
                });

                return cleanData.map(row => {
                    if (platform === 'google') {
                        const clicks = parseInt(String(row.Clicks || 0).replace(/,/g, '')) || 0;
                        const impressions = parseInt(String(row['Impr.'] || row.Impr || 0).replace(/,/g, '')) || 0;
                        const cost = parseFloat(String(row.Cost || 0).replace(/,/g, '')) || 0;
                        const conversions = parseFloat(String(row.Conversions || 0).replace(/,/g, '')) || 0;
                        const ctr = parseFloat(String(row.CTR || 0).replace(/%/g, '')) || 0;
                        const cpc = parseFloat(String(row['Avg. CPC'] || 0).replace(/,/g, '')) || 0;
                        
                        return {
                            id: `google-${Date.now()}-${Math.random()}`,
                            platform: 'google',
                            name: row.Campaign,
                            impressions, clicks, spend: cost, conversions,
                            date: row.Month || new Date().toISOString().split('T')[0],
                            creative: row['Campaign type'] || '',
                            ctr, cpc,
                            cpa: conversions > 0 ? cost / conversions : 0,
                        };
                    } else {
                        const impressions = parseInt(String(row.Impressions || 0).replace(/,/g, '')) || 0;
                        const clicks = parseInt(String(row['Clicks (all)'] || 0).replace(/,/g, '')) || 0;
                        const spend = parseFloat(String(row['Amount spent (INR)'] || 0).replace(/,/g, '')) || 0;
                        const purchases = parseInt(String(row.Purchases || 0).replace(/,/g, '')) || 0;
                        const leads = parseInt(String(row.Leads || 0).replace(/,/g, '')) || 0;
                        const conversions = purchases + leads;
                        const ctr = parseFloat(String(row['CTR (all)'] || 0).replace(/%/g, '')) || 0;
                        const cpc = parseFloat(String(row['CPC (all)'] || 0).replace(/,/g, '')) || 0;
                        
                        return {
                            id: `meta-${Date.now()}-${Math.random()}`,
                            platform: 'meta',
                            name: row['Campaign name'],
                            impressions, clicks, spend, conversions,
                            date: row.Month || row['Reporting starts'] || new Date().toISOString().split('T')[0],
                            creative: row['Ad name'] || row['Ad set name'] || '',
                            ctr, cpc,
                            cpa: conversions > 0 ? spend / conversions : 0,
                        };
                    }
                }).filter(c => c.impressions > 0 || c.spend > 0);
            };

            const aggregateCampaigns = (campaigns) => {
                const grouped = campaigns.reduce((acc, camp) => {
                    const key = `${camp.platform}-${camp.name}`;
                    if (!acc[key]) acc[key] = [];
                    acc[key].push(camp);
                    return acc;
                }, {});

                return Object.entries(grouped).map(([key, camps]) => ({
                    id: camps[0].id,
                    platform: camps[0].platform,
                    name: camps[0].name,
                    impressions: camps.reduce((s, c) => s + c.impressions, 0),
                    clicks: camps.reduce((s, c) => s + c.clicks, 0),
                    spend: camps.reduce((s, c) => s + c.spend, 0),
                    conversions: camps.reduce((s, c) => s + c.conversions, 0),
                    date: camps[0].date,
                    creative: camps[0].creative,
                    ctr: camps.reduce((s, c) => s + c.impressions, 0) > 0 ? 
                         (camps.reduce((s, c) => s + c.clicks, 0) / camps.reduce((s, c) => s + c.impressions, 0)) * 100 : 0,
                    cpc: camps.reduce((s, c) => s + c.clicks, 0) > 0 ? 
                         camps.reduce((s, c) => s + c.spend, 0) / camps.reduce((s, c) => s + c.clicks, 0) : 0,
                    cpa: camps.reduce((s, c) => s + c.conversions, 0) > 0 ? 
                         camps.reduce((s, c) => s + c.spend, 0) / camps.reduce((s, c) => s + c.conversions, 0) : 0,
                    dailyData: camps.sort((a, b) => new Date(a.date) - new Date(b.date))
                }));
            };

            const toggleCampaignSelection = (campaignId) => {
                setSelectedCampaigns(prev => {
                    if (prev.includes(campaignId)) {
                        return prev.filter(id => id !== campaignId);
                    } else {
                        return [...prev, campaignId];
                    }
                });
            };

            const selectAllCampaigns = () => {
                const filtered = getFilteredCampaigns();
                setSelectedCampaigns(filtered.map(c => c.id));
            };

            const clearSelection = () => {
                setSelectedCampaigns([]);
            };

            const getFilteredCampaigns = () => {
                let filtered = campaigns;
                
                if (platformFilter !== 'all') {
                    filtered = filtered.filter(c => c.platform === platformFilter);
                }
                
                if (searchTerm) {
                    filtered = filtered.filter(c => 
                        c.name.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }
                
                return filtered;
            };

            const getSelectedCampaignsData = () => {
                return campaigns.filter(c => selectedCampaigns.includes(c.id));
            };

            const clearData = () => {
                if (confirm('Clear all data?')) {
                    setCampaigns([]);
                    setSelectedCampaigns([]);
                    saveData([]);
                }
            };

            return (
                <div className="container">
                    <Header 
                        campaignCount={campaigns.length}
                        selectedCount={selectedCampaigns.length}
                        onClear={clearData}
                    />
                    
                    {campaigns.length === 0 ? (
                        <UploadSection onUpload={handleFileUpload} />
                    ) : (
                        <>
                            <ControlPanel
                                platformFilter={platformFilter}
                                setPlatformFilter={setPlatformFilter}
                                searchTerm={searchTerm}
                                setSearchTerm={setSearchTerm}
                                selectedCount={selectedCampaigns.length}
                                totalCount={getFilteredCampaigns().length}
                                onSelectAll={selectAllCampaigns}
                                onClearSelection={clearSelection}
                                comparisonMode={comparisonMode}
                                setComparisonMode={setComparisonMode}
                            />
                            
                            <TabNavigation activeTab={activeTab} setActiveTab={setActiveTab} />
                            
                            {activeTab === 'overview' && (
                                <OverviewTab campaigns={getFilteredCampaigns()} />
                            )}
                            
                            {activeTab === 'compare' && (
                                <CompareTab 
                                    campaigns={campaigns}
                                    selectedCampaigns={getSelectedCampaignsData()}
                                    selectedMetrics={selectedMetrics}
                                    setSelectedMetrics={setSelectedMetrics}
                                />
                            )}
                            
                            {activeTab === 'trends' && (
                                <TrendsTab 
                                    campaigns={getSelectedCampaignsData().length > 0 ? getSelectedCampaignsData() : getFilteredCampaigns()}
                                />
                            )}
                            
                            {activeTab === 'cohorts' && (
                                <CohortsTab 
                                    campaigns={getFilteredCampaigns()}
                                    cohortBy={cohortBy}
                                    setCohortBy={setCohortBy}
                                />
                            )}
                            
                            {activeTab === 'selector' && (
                                <CampaignSelector
                                    campaigns={getFilteredCampaigns()}
                                    selectedCampaigns={selectedCampaigns}
                                    onToggle={toggleCampaignSelection}
                                />
                            )}
                        </>
                    )}
                </div>
            );
        }

        function Header({ campaignCount, selectedCount, onClear }) {
            return (
                <header className="glass-card mb-6 fade-in">
                    <div className="flex justify-between items-center">
                        <div>
                            <h1 className="text-3xl font-bold" style={{
                                background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                WebkitBackgroundClip: 'text',
                                WebkitTextFillColor: 'transparent'
                            }}>Enterprise Marketing Command Center</h1>
                            <p className="text-gray-400 text-sm mt-1">CMO-Grade Analytics Platform</p>
                        </div>
                        <div className="text-right">
                            <div className="text-2xl font-bold mono">{campaignCount}</div>
                            <div className="text-xs text-gray-400">Total Campaigns</div>
                            {selectedCount > 0 && (
                                <div className="text-sm text-purple-400 mt-1">{selectedCount} Selected</div>
                            )}
                            {campaignCount > 0 && (
                                <button onClick={onClear} className="text-xs text-red-400 hover:text-red-300 mt-2">
                                    Clear Data
                                </button>
                            )}
                        </div>
                    </div>
                </header>
            );
        }

        function UploadSection({ onUpload }) {
            return (
                <div className="glass-card fade-in">
                    <h2 className="text-xl font-bold mb-4">Upload Campaign Data</h2>
                    <div className="grid-2">
                        <div>
                            <label className="block mb-2 text-sm font-semibold text-gray-300">Google Ads CSV</label>
                            <input type="file" accept=".csv" onChange={(e) => onUpload(e, 'google')} />
                        </div>
                        <div>
                            <label className="block mb-2 text-sm font-semibold text-gray-300">Meta Ads CSV</label>
                            <input type="file" accept=".csv" onChange={(e) => onUpload(e, 'meta')} />
                        </div>
                    </div>
                </div>
            );
        }

        function ControlPanel({ 
            platformFilter, setPlatformFilter, searchTerm, setSearchTerm,
            selectedCount, totalCount, onSelectAll, onClearSelection,
            comparisonMode, setComparisonMode
        }) {
            return (
                <div className="glass-card mb-6 fade-in">
                    <div className="grid-4 mb-4">
                        <div>
                            <label className="block mb-2 text-sm font-semibold text-gray-300">Platform Filter</label>
                            <select value={platformFilter} onChange={(e) => setPlatformFilter(e.target.value)}>
                                <option value="all">All Platforms</option>
                                <option value="google">Google Ads</option>
                                <option value="meta">Meta Ads</option>
                            </select>
                        </div>
                        <div className="col-span-2">
                            <label className="block mb-2 text-sm font-semibold text-gray-300">Search Campaigns</label>
                            <input 
                                type="text"
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                placeholder="Type to search..."
                            />
                        </div>
                        <div className="flex items-end">
                            <button 
                                onClick={() => setComparisonMode(!comparisonMode)}
                                className={comparisonMode ? 'btn-primary w-full' : 'btn-secondary w-full'}
                            >
                                {comparisonMode ? '✓ Comparison Mode' : 'Comparison Mode'}
                            </button>
                        </div>
                    </div>
                    <div className="flex justify-between items-center">
                        <div className="text-sm text-gray-400">
                            {selectedCount} of {totalCount} campaigns selected
                        </div>
                        <div className="flex gap-2">
                            <button onClick={onSelectAll} className="btn-secondary text-sm py-2 px-4">
                                Select All ({totalCount})
                            </button>
                            <button onClick={onClearSelection} className="btn-secondary text-sm py-2 px-4">
                                Clear Selection
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function TabNavigation({ activeTab, setActiveTab }) {
            const tabs = [
                { id: 'overview', label: '📊 Overview' },
                { id: 'selector', label: '✓ Select Campaigns' },
                { id: 'compare', label: '⚖️ Compare' },
                { id: 'trends', label: '📈 Daily Trends' },
                { id: 'cohorts', label: '👥 Cohort Analysis' }
            ];

            return (
                <div className="glass-card mb-6 fade-in">
                    <div className="flex overflow-x-auto gap-2">
                        {tabs.map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`tab-button ${activeTab === tab.id ? 'active' : ''}`}
                            >
                                {tab.label}
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        function OverviewTab({ campaigns }) {
            const totalSpend = campaigns.reduce((s, c) => s + c.spend, 0);
            const totalConversions = campaigns.reduce((s, c) => s + c.conversions, 0);
            const totalClicks = campaigns.reduce((s, c) => s + c.clicks, 0);
            const totalImpressions = campaigns.reduce((s, c) => s + c.impressions, 0);
            const avgCPA = totalConversions > 0 ? totalSpend / totalConversions : 0;
            const avgCTR = totalImpressions > 0 ? (totalClicks / totalImpressions) * 100 : 0;

            return (
                <div className="fade-in">
                    <div className="grid-4 mb-6">
                        <div className="metric-card">
                            <div className="text-center">
                                <div className="stat-value">₹{(totalSpend / 100000).toFixed(1)}L</div>
                                <div className="text-sm text-gray-400 mt-2">Total Spend</div>
                            </div>
                        </div>
                        <div className="metric-card">
                            <div className="text-center">
                                <div className="stat-value">{totalConversions.toLocaleString()}</div>
                                <div className="text-sm text-gray-400 mt-2">Conversions</div>
                            </div>
                        </div>
                        <div className="metric-card">
                            <div className="text-center">
                                <div className="stat-value">₹{avgCPA.toFixed(0)}</div>
                                <div className="text-sm text-gray-400 mt-2">Avg CPA</div>
                            </div>
                        </div>
                        <div className="metric-card">
                            <div className="text-center">
                                <div className="stat-value">{avgCTR.toFixed(2)}%</div>
                                <div className="text-sm text-gray-400 mt-2">Avg CTR</div>
                            </div>
                        </div>
                    </div>

                    <div className="glass-card">
                        <h3 className="text-lg font-bold mb-4">📱 All Campaigns</h3>
                        <div className="grid-3 gap-4">
                            {campaigns.slice(0, 9).map(c => (
                                <div key={c.id} className="campaign-row">
                                    <div className="flex justify-between items-start mb-2">
                                        <div className="flex-1">
                                            <div className="font-bold text-sm mb-1">{c.name.substring(0, 30)}</div>
                                            <span className={`badge ${c.platform === 'google' ? 'badge-google' : 'badge-meta'}`}>
                                                {c.platform}
                                            </span>
                                        </div>
                                    </div>
                                    <div className="grid-2 gap-2 text-xs mt-2">
                                        <div>
                                            <span className="text-gray-400">Spend:</span>
                                            <span className="ml-1 font-semibold">₹{(c.spend / 1000).toFixed(0)}K</span>
                                        </div>
                                        <div>
                                            <span className="text-gray-400">CPA:</span>
                                            <span className="ml-1 font-semibold">₹{c.cpa.toFixed(0)}</span>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        {campaigns.length > 9 && (
                            <div className="text-center mt-4 text-sm text-gray-400">
                                +{campaigns.length - 9} more campaigns
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function CampaignSelector({ campaigns, selectedCampaigns, onToggle }) {
            return (
                <div className="glass-card fade-in">
                    <h3 className="text-xl font-bold mb-4">✓ Select Campaigns for Analysis</h3>
                    <div className="max-h-96 overflow-y-auto">
                        {campaigns.map(campaign => (
                            <div 
                                key={campaign.id}
                                className={`campaign-row ${selectedCampaigns.includes(campaign.id) ? 'selected' : ''}`}
                            >
                                <div className="flex items-center gap-4">
                                    <div className="checkbox-container">
                                        <input 
                                            type="checkbox"
                                            checked={selectedCampaigns.includes(campaign.id)}
                                            onChange={() => onToggle(campaign.id)}
                                        />
                                    </div>
                                    <div className="flex-1">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <div className="font-bold text-sm mb-1">{campaign.name}</div>
                                                <span className={`badge ${campaign.platform === 'google' ? 'badge-google' : 'badge-meta'}`}>
                                                    {campaign.platform}
                                                </span>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-lg font-bold mono">₹{(campaign.spend / 1000).toFixed(0)}K</div>
                                                <div className="text-xs text-gray-400">{campaign.conversions} conv</div>
                                            </div>
                                        </div>
                                        <div className="grid-4 gap-2 text-xs mt-2">
                                            <div>
                                                <span className="text-gray-400">CPA:</span>
                                                <span className="ml-1 font-semibold">₹{campaign.cpa.toFixed(0)}</span>
                                            </div>
                                            <div>
                                                <span className="text-gray-400">CTR:</span>
                                                <span className="ml-1 font-semibold">{campaign.ctr.toFixed(2)}%</span>
                                            </div>
                                            <div>
                                                <span className="text-gray-400">Clicks:</span>
                                                <span className="ml-1 font-semibold">{campaign.clicks.toLocaleString()}</span>
                                            </div>
                                            <div>
                                                <span className="text-gray-400">Impr:</span>
                                                <span className="ml-1 font-semibold">{(campaign.impressions / 1000).toFixed(0)}K</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function CompareTab({ campaigns, selectedCampaigns, selectedMetrics, setSelectedMetrics }) {
            const metrics = [
                { id: 'spend', label: 'Spend', format: (v) => `₹${(v / 1000).toFixed(0)}K` },
                { id: 'conversions', label: 'Conversions', format: (v) => v.toLocaleString() },
                { id: 'cpa', label: 'CPA', format: (v) => `₹${v.toFixed(0)}` },
                { id: 'ctr', label: 'CTR', format: (v) => `${v.toFixed(2)}%` },
                { id: 'cpc', label: 'CPC', format: (v) => `₹${v.toFixed(2)}` },
                { id: 'impressions', label: 'Impressions', format: (v) => (v / 1000).toFixed(0) + 'K' },
                { id: 'clicks', label: 'Clicks', format: (v) => v.toLocaleString() }
            ];

            const toggleMetric = (metricId) => {
                setSelectedMetrics(prev => {
                    if (prev.includes(metricId)) {
                        return prev.filter(id => id !== metricId);
                    } else {
                        return [...prev, metricId];
                    }
                });
            };

            if (selectedCampaigns.length === 0) {
                return (
                    <div className="glass-card fade-in text-center py-12">
                        <div className="text-4xl mb-4">📊</div>
                        <h3 className="text-xl font-bold mb-2">No Campaigns Selected</h3>
                        <p className="text-gray-400 mb-4">Select 2 or more campaigns from the "Select Campaigns" tab to compare them</p>
                    </div>
                );
            }

            // Find winner for each metric
            const winners = {};
            selectedMetrics.forEach(metricId => {
                if (metricId === 'cpa' || metricId === 'cpc') {
                    // Lower is better
                    winners[metricId] = selectedCampaigns.reduce((best, current) => 
                        current[metricId] < best[metricId] ? current : best
                    );
                } else {
                    // Higher is better
                    winners[metricId] = selectedCampaigns.reduce((best, current) => 
                        current[metricId] > best[metricId] ? current : best
                    );
                }
            });

            return (
                <div className="fade-in">
                    <div className="glass-card mb-6">
                        <h3 className="text-lg font-bold mb-4">Select Metrics to Compare</h3>
                        <div className="grid-4">
                            {metrics.map(metric => (
                                <div key={metric.id} className="checkbox-container">
                                    <input 
                                        type="checkbox"
                                        checked={selectedMetrics.includes(metric.id)}
                                        onChange={() => toggleMetric(metric.id)}
                                    />
                                    <label>{metric.label}</label>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="glass-card">
                        <h3 className="text-xl font-bold mb-6">⚖️ Campaign Comparison</h3>
                        <div className="grid gap-4" style={{
                            gridTemplateColumns: `repeat(${selectedCampaigns.length}, 1fr)`
                        }}>
                            {selectedCampaigns.map((campaign, idx) => {
                                const isWinner = (metricId) => winners[metricId]?.id === campaign.id;
                                const hasAnyWin = selectedMetrics.some(m => isWinner(m));
                                
                                return (
                                    <div key={campaign.id} className={`comparison-card ${hasAnyWin ? 'winner' : ''}`}>
                                        {hasAnyWin && <div className="winner-badge">👑</div>}
                                        <div className="mb-4">
                                            <h4 className="font-bold text-lg mb-2">{campaign.name}</h4>
                                            <span className={`badge ${campaign.platform === 'google' ? 'badge-google' : 'badge-meta'}`}>
                                                {campaign.platform}
                                            </span>
                                        </div>
                                        
                                        {selectedMetrics.map(metricId => {
                                            const metric = metrics.find(m => m.id === metricId);
                                            const value = campaign[metricId];
                                            const winner = isWinner(metricId);
                                            
                                            return (
                                                <div key={metricId} className="mb-3 pb-3 border-b border-gray-700 last:border-0">
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-sm text-gray-400">{metric.label}</span>
                                                        <span className={`text-lg font-bold mono ${winner ? 'text-green-400' : ''}`}>
                                                            {metric.format(value)}
                                                            {winner && ' ✓'}
                                                        </span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function TrendsTab({ campaigns }) {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartRef.current && campaigns.length > 0) {
                    renderTrendChart();
                }
                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [campaigns]);

            const renderTrendChart = () => {
                const ctx = chartRef.current.getContext('2d');
                
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const datasets = campaigns.map((campaign, idx) => {
                    const colors = ['#667eea', '#22c55e', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4'];
                    const color = colors[idx % colors.length];
                    
                    return {
                        label: campaign.name.substring(0, 30),
                        data: campaign.dailyData ? campaign.dailyData.map(d => ({
                            x: d.date,
                            y: d.spend
                        })) : [],
                        borderColor: color,
                        backgroundColor: color + '33',
                        tension: 0.4
                    };
                });

                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: { datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: { color: '#e4e4e7' }
                            }
                        },
                        scales: {
                            x: {
                                type: 'time',
                                time: { unit: 'day' },
                                grid: { color: 'rgba(255,255,255,0.1)' },
                                ticks: { color: '#a1a1aa' }
                            },
                            y: {
                                grid: { color: 'rgba(255,255,255,0.1)' },
                                ticks: { 
                                    color: '#a1a1aa',
                                    callback: (value) => '₹' + (value / 1000).toFixed(0) + 'K'
                                }
                            }
                        }
                    }
                });
            };

            if (campaigns.length === 0) {
                return (
                    <div className="glass-card fade-in text-center py-12">
                        <div className="text-4xl mb-4">📈</div>
                        <h3 className="text-xl font-bold mb-2">No Campaigns Selected</h3>
                        <p className="text-gray-400">Select campaigns to see daily trends</p>
                    </div>
                );
            }

            return (
                <div className="glass-card fade-in">
                    <h3 className="text-xl font-bold mb-6">📈 Daily Spend Trends</h3>
                    <div style={{height: '500px'}}>
                        <canvas ref={chartRef}></canvas>
                    </div>
                </div>
            );
        }

        function CohortsTab({ campaigns, cohortBy, setCohortBy }) {
            const getCohorts = () => {
                if (cohortBy === 'platform') {
                    return campaigns.reduce((acc, c) => {
                        if (!acc[c.platform]) acc[c.platform] = [];
                        acc[c.platform].push(c);
                        return acc;
                    }, {});
                } else if (cohortBy === 'performance') {
                    const avgCPA = campaigns.reduce((s, c) => s + c.cpa, 0) / campaigns.length;
                    return {
                        'High Performers': campaigns.filter(c => c.cpa > 0 && c.cpa < avgCPA * 0.8),
                        'Average Performers': campaigns.filter(c => c.cpa >= avgCPA * 0.8 && c.cpa <= avgCPA * 1.2),
                        'Low Performers': campaigns.filter(c => c.cpa > avgCPA * 1.2)
                    };
                }
            };

            const cohorts = getCohorts();

            return (
                <div className="glass-card fade-in">
                    <div className="flex justify-between items-center mb-6">
                        <h3 className="text-xl font-bold">👥 Cohort Analysis</h3>
                        <select value={cohortBy} onChange={(e) => setCohortBy(e.target.value)}>
                            <option value="platform">Group by Platform</option>
                            <option value="performance">Group by Performance</option>
                        </select>
                    </div>

                    {Object.entries(cohorts).map(([cohort, cohortCampaigns]) => {
                        if (cohortCampaigns.length === 0) return null;
                        
                        const totalSpend = cohortCampaigns.reduce((s, c) => s + c.spend, 0);
                        const totalConversions = cohortCampaigns.reduce((s, c) => s + c.conversions, 0);
                        const avgCPA = totalConversions > 0 ? totalSpend / totalConversions : 0;

                        return (
                            <div key={cohort} className="mb-6 p-4 rounded-lg" style={{
                                background: 'linear-gradient(135deg, rgba(102,126,234,0.1) 0%, rgba(118,75,162,0.05) 100%)',
                                border: '1px solid rgba(102,126,234,0.2)'
                            }}>
                                <div className="flex justify-between items-center mb-4">
                                    <h4 className="text-lg font-bold capitalize">{cohort}</h4>
                                    <span className="text-sm text-gray-400">{cohortCampaigns.length} campaigns</span>
                                </div>
                                <div className="grid-4 gap-4 mb-4">
                                    <div className="text-center">
                                        <div className="text-xl font-bold text-purple-400">₹{(totalSpend / 100000).toFixed(1)}L</div>
                                        <div className="text-xs text-gray-400 mt-1">Total Spend</div>
                                    </div>
                                    <div className="text-center">
                                        <div className="text-xl font-bold text-green-400">{totalConversions}</div>
                                        <div className="text-xs text-gray-400 mt-1">Conversions</div>
                                    </div>
                                    <div className="text-center">
                                        <div className="text-xl font-bold text-blue-400">₹{avgCPA.toFixed(0)}</div>
                                        <div className="text-xs text-gray-400 mt-1">Avg CPA</div>
                                    </div>
                                    <div className="text-center">
                                        <div className="text-xl font-bold text-yellow-400">
                                            {((totalSpend / campaigns.reduce((s, c) => s + c.spend, 0)) * 100).toFixed(0)}%
                                        </div>
                                        <div className="text-xs text-gray-400 mt-1">% of Total Spend</div>
                                    </div>
                                </div>
                                <div className="grid-3 gap-2">
                                    {cohortCampaigns.slice(0, 6).map(c => (
                                        <div key={c.id} className="text-xs p-2 rounded bg-black bg-opacity-20">
                                            <div className="font-semibold mb-1">{c.name.substring(0, 25)}</div>
                                            <div className="text-gray-400">₹{(c.spend / 1000).toFixed(0)}K • CPA: ₹{c.cpa.toFixed(0)}</div>
                                        </div>
                                    ))}
                                </div>
                                {cohortCampaigns.length > 6 && (
                                    <div className="text-center mt-2 text-xs text-gray-400">
                                        +{cohortCampaigns.length - 6} more
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>
            );
        }

        ReactDOM.render(<EnterpriseDashboard />, document.getElementById('root'));
    </script>
</body>
</html>
